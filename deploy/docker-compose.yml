name: nexcad

# BEGIN ANSON DEPLOY MANAGED BLOCK
services:
  "nexcad":
    image: "${ANSON_DEPLOY_IMAGE:?ANSON_DEPLOY_IMAGE must be set to an immutable revision}"
    container_name: "nexcad"
    restart: unless-stopped
    ports:
      - "5174:80"
    labels:
      com.anson-deploy.app: "nexcad"
      com.anson-deploy.repository: "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set}"
    networks:
      - ai_network

networks:
  ai_network:
    external: true
# END ANSON DEPLOY MANAGED BLOCK
